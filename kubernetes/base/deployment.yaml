apiVersion: apps/v1
kind: Deployment
metadata:
  name: lnp-predict
spec:
  replicas: 1
  selector:
    matchLabels: {app: lnp-predict}
  template:
    metadata:
      labels: {app: lnp-predict, azure.workload.identity/use: "true"}
    spec:
      serviceAccountName: lnp-predict
      containers:
        - name: api
          image: lnp-predict:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: model-config}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lnp-predict
