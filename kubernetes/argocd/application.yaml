apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lnp-predict
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jackaI1/lnp-transfection-benchmark.git
    targetRevision: main
    path: kubernetes/overlays/aks
  destination:
    server: https://kubernetes.default.svc
    namespace: lnp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
