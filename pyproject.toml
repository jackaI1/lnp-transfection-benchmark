[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lnp-transfection-benchmark"
version = "0.1.0"
description = "Reproducible lipid transfection regression with leakage-aware scaffold evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "rdkit==2025.3.6",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "matplotlib==3.10.7",
  "joblib==1.5.2",
  "threadpoolctl==3.6.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[project.scripts]
lnp-benchmark = "lnp_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lnp_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
