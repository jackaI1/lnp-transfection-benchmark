name: deploy Azure inference
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: azure
    permissions:
      contents: read
      id-token: write
    env:
      GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PRINCIPAL: ${{ vars.AZURE_PRINCIPAL_ID }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - run: uv sync --locked --python 3.11
      - name: Train and export the real model
        run: |
          uv run lnp-benchmark download
          uv run lnp-benchmark featurize
          uv run lnp-benchmark train
          uv run python -m lnp_benchmark.artifact
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Provision registry, storage and identities
        run: |
          az deployment group create -g "$GROUP" -n lnp-foundation \
            --template-file infra/main.bicep --parameters deployerPrincipalId="$PRINCIPAL" \
            --query properties.outputs -o json > /tmp/foundation.json
          jq -r '"REGISTRY=" + .registryName.value, "SERVER=" + .registryServer.value, "STORAGE=" + .storageName.value' /tmp/foundation.json >> "$GITHUB_ENV"
      - name: Upload checksum-pinned weights
        run: |
          for attempt in $(seq 1 20); do
            if az storage blob upload --auth-mode login --account-name "$STORAGE" \
              --container-name models --name "$GITHUB_SHA/model.joblib" \
              --file results/deploy/model.joblib --overwrite true --only-show-errors -o none; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to registry
        run: |
          for attempt in $(seq 1 20); do
            if az acr login -n "$REGISTRY"; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.SERVER }}/lnp-predict:${{ github.sha }}
      - name: Deploy app and check live predictions
        run: |
          jq --arg image "$SERVER/lnp-predict:$GITHUB_SHA" \
            --arg blob "$GITHUB_SHA/model.joblib" \
            --arg sha "$(cat results/deploy/model.joblib.sha256)" \
            '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#", contentVersion:"1.0.0.0", parameters: {registryServer:{value:.registryServer.value}, image:{value:$image}, accountUrl:{value:.accountUrl.value}, identityId:{value:.identityId.value}, environmentId:{value:.environmentId.value}, modelBlob:{value:$blob}, modelSha256:{value:$sha}}}' \
            /tmp/foundation.json > /tmp/app.parameters.json
          URL=$(az deployment group create -g "$GROUP" -n lnp-app \
            --template-file infra/app.bicep --parameters @/tmp/app.parameters.json \
            --query properties.outputs.url.value -o tsv)
          uv run python scripts/check_endpoint.py "$URL" \
            --sha256 "$(cat results/deploy/model.joblib.sha256)"
          echo "Prediction endpoint: $URL" >> "$GITHUB_STEP_SUMMARY"
